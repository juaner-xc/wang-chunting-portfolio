<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="王椿婷的前端网页作品集" />
    <title>王椿婷的前端网页作品集</title>
    <style>
      :root {
        --accent: #ee6940;
        --accent-dark: #d6512b;
        --text: #28231f;
        --muted: #8e8781;
        --surface: #fff;
        --background: #f5f7f9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background:
          radial-gradient(circle at 18% 18%, rgba(238, 105, 64, 0.08), transparent 25rem),
          linear-gradient(180deg, #fbfcfd 0%, var(--background) 100%);
        font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      }

      .page {
        width: min(1180px, calc(100% - 48px));
        margin: 0 auto;
        padding: 68px 0 90px;
      }

      .hero {
        margin-bottom: 34px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: var(--accent);
        font-size: clamp(30px, 4.3vw, 48px);
        line-height: 1.2;
        letter-spacing: 0.02em;
        text-shadow: 0 8px 24px rgba(238, 105, 64, 0.13);
      }

      .intro {
        margin: 15px auto 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.8;
      }

      .portfolio-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }

      .project-card {
        display: flex;
        min-width: 0;
        overflow: hidden;
        border: 1px solid rgba(42, 35, 30, 0.07);
        border-radius: 13px;
        background: var(--surface);
        box-shadow: 0 8px 22px rgba(31, 40, 48, 0.1);
        color: inherit;
        text-decoration: none;
        flex-direction: column;
        transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      }

      .project-card:hover {
        transform: translateY(-7px);
        border-color: rgba(238, 105, 64, 0.34);
        box-shadow: 0 18px 40px rgba(31, 40, 48, 0.15);
      }

      .project-card:focus-visible {
        outline: 4px solid rgba(238, 105, 64, 0.24);
        outline-offset: 4px;
      }

      .preview {
        position: relative;
        height: 250px;
        overflow: hidden;
        background: #f5eee8;
      }

      .preview img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        transition: transform 320ms ease;
      }

      .project-card:hover .preview img {
        transform: scale(1.025);
      }

      .number {
        position: absolute;
        top: 16px;
        left: 16px;
        display: grid;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(255, 255, 255, 0.56);
        border-radius: 50%;
        background: rgba(35, 29, 25, 0.72);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        place-items: center;
        backdrop-filter: blur(8px);
      }

      .project-info {
        display: flex;
        min-height: 128px;
        padding: 22px 22px 24px;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
      }

      .project-info h2 {
        margin: 0 0 9px;
        font-size: 23px;
        line-height: 1.25;
      }

      .project-info p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .arrow {
        display: grid;
        flex: 0 0 auto;
        width: 42px;
        height: 42px;
        margin-top: 1px;
        border-radius: 50%;
        background: #ffe0d6;
        color: var(--accent-dark);
        font-size: 20px;
        transition: transform 180ms ease, background 180ms ease;
        place-items: center;
      }

      .project-card:hover .arrow {
        transform: translateX(3px);
        background: var(--accent);
        color: #fff;
      }

      footer {
        margin-top: 34px;
        color: #aaa39d;
        font-size: 13px;
        text-align: center;
      }

      @media (max-width: 900px) {
        .portfolio-grid {
          grid-template-columns: 1fr;
          max-width: 680px;
          margin: 0 auto;
        }

        .preview {
          height: 310px;
        }
      }

      @media (max-width: 560px) {
        .page {
          width: min(100% - 28px, 1180px);
          padding: 44px 0 60px;
        }

        .hero {
          margin-bottom: 25px;
        }

        .intro {
          font-size: 14px;
        }

        .preview {
          height: 220px;
        }

        .project-info {
          min-height: 112px;
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">Front-end Portfolio</p>
        <h1>王椿婷的前端网页作品集</h1>
        <p class="intro">这是我的前端网页作品，点击卡片即可跳转到对应页面。</p>
      </header>

      <section class="portfolio-grid" aria-label="前端作品列表">
        <a
          class="project-card"
          href="https://homework1-one-chi.vercel.app/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="打开作品一：账户注册页面"
        >
          <div class="preview">
            <img src="assets/01-register.png" alt="账户注册页面截图" />
            <span class="number">01</span>
          </div>
          <div class="project-info">
            <div>
              <h2>账户注册页面</h2>
              <p>Register Form · 表单界面设计</p>
            </div>
            <span class="arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a
          class="project-card"
          href="https://quiz-game-phi-sooty.vercel.app/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="打开作品二：Quiz Game"
        >
          <div class="preview">
            <img src="assets/02-quiz.png" alt="Quiz Game 页面截图" />
            <span class="number">02</span>
          </div>
          <div class="project-info">
            <div>
              <h2>Quiz Game</h2>
              <p>答题小游戏 · 互动页面</p>
            </div>
            <span class="arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a
          class="project-card"
          href="https://homework2-khaki-eta.vercel.app/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="打开作品三：菜单搜索页面"
        >
          <div class="preview">
            <img src="assets/03-menu.png" alt="菜单搜索页面截图" />
            <span class="number">03</span>
          </div>
          <div class="project-info">
            <div>
              <h2>菜单搜索</h2>
              <p>Menu Search · 菜单筛选页面</p>
            </div>
            <span class="arrow" aria-hidden="true">→</span>
          </div>
        </a>
      </section>

      <footer>© 2026 王椿婷 · Front-end Portfolio</footer>
    </main>
  </body>
</html>
